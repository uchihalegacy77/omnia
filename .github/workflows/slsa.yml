name: OMNIA SLSA Builder V1.0

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [created]

env:
  BINARY_NAME: omnia
  RELEASE_BINARY_PATH: target/release/omnia

jobs:
  build:
    name: Build Universal Engine
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Omni-Drive Engine
        run: cargo build --release

      - name: Generate Security Hashes
        id: hash
        run: |
          set -e
          
          # Verify binary exists before processing
          if [ ! -f "${{ env.RELEASE_BINARY_PATH }}" ]; then
            echo "Error: Binary not found at ${{ env.RELEASE_BINARY_PATH }}"
            exit 1
          fi
          
          # Generate hash directly from source
          echo "hashes=$(sha256sum ${{ env.RELEASE_BINARY_PATH }} | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload Engine Binary
        uses: actions/upload-artifact@v4
        with:
          name: omnia-engine
          path: ${{ env.RELEASE_BINARY_PATH }}

  provenance:
    needs: [build]
    name: Generate Cryptographic Certificate
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
    secrets: inherit
